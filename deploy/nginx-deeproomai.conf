## /etc/nginx/sites-available/deeproomai.com
## ln -s /etc/nginx/sites-available/deeproomai.com /etc/nginx/sites-enabled/
##
## Bu dosya certbot CALISMADAN ONCEKI halidir (sadece port 80).
## `certbot --nginx -d deeproomai.com -d www.deeproomai.com` calistirildiginda
## certbot 443 blogunu ve http->https yonlendirmesini kendisi ekler.

server {
    listen 80;
    listen [::]:80;
    server_name deeproomai.com www.deeproomai.com;

    # Certbot HTTP-01 dogrulamasi
    location /.well-known/acme-challenge/ {
        root /var/www/html;
        allow all;
    }

    access_log /var/log/nginx/deeproomai.access.log;
    error_log  /var/log/nginx/deeproomai.error.log;

    # Yuklemeler / TTS-STT ses dosyalari icin
    client_max_body_size 25M;

    # Not: /_next/static icin ayrica cache blogu gerekmiyor -
    # Next.js zaten immutable Cache-Control header'i gonderiyor.

    location / {
        proxy_pass http://127.0.0.1:3021;
        proxy_http_version 1.1;

        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;

        proxy_cache_bypass $http_upgrade;
        proxy_redirect off;

        # OpenAI cagrilari (chat/tts/stt) yavas olabilir
        proxy_connect_timeout 60s;
        proxy_send_timeout    300s;
        proxy_read_timeout    300s;

        # Streaming yanitlarin takilmamasi icin
        proxy_buffering off;
    }
}
